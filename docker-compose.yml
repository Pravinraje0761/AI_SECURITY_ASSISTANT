version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./digital_bodyguard.db
      - SECRET_KEY=change-this-to-a-random-secret-in-production
      - DEBUG=False
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:80"]
      - LOG_LEVEL=INFO
    volumes:
      - db_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
