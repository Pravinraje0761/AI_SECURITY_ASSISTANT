version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./digital_bodyguard.db
      # Set SECRET_KEY in your shell or a .env file; if empty, the API uses a random per-process key.
      - SECRET_KEY=${SECRET_KEY:-}
      - DEBUG=False
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:80"]
      - LOG_LEVEL=INFO
    volumes:
      - db_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
